name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Level checker
        run: npm run levels:check
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          retention-days: 7
